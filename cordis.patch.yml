# This bundle adds only its own Host plugin row. It does not disable, replace,
# or patch any official DeepSeek Harness entry.
- insert:
    - id: dsh-safe-plugin-manager
      name: dsh-safe-plugin-manager
      config:
        defaultProfile: web
        mutationsEnabled: true
        telemetryEnabled: false
        catalogUrl: https://raw.githubusercontent.com/AI-Scarlett/dsh-safe-plugin-manager/main/registry/catalog.json
