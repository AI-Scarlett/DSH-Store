name: Notify owner after every Catalog scan

on:
  workflow_call:
    inputs:
      catalog_run_id:
        required: true
        type: string
      catalog_run_attempt:
        required: true
        type: string
      catalog_conclusion:
        required: true
        type: string
      inline_catalog_run:
        required: false
        default: false
        type: boolean
      request_id:
        required: false
        default: catalog-inline
        type: string
  workflow_dispatch:
    inputs:
      catalog_run_id:
        description: Exact completed Catalog run ID to report
        required: true
        type: string
      catalog_run_attempt:
        description: Exact Catalog run attempt containing the decision artifacts
        required: true
        default: "1"
        type: string
      request_id:
        description: Unique caller correlation identifier
        required: false
        default: manual
        type: string

run-name: Owner report for Catalog #${{ inputs.catalog_run_id }} (${{ inputs.request_id }})

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: catalog-run-report-${{ inputs.catalog_run_id }}-${{ inputs.catalog_run_attempt }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the exact Catalog run
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ inputs.catalog_run_id }}
          CATALOG_RUN_ATTEMPT: ${{ inputs.catalog_run_attempt }}
          CATALOG_CONCLUSION: ${{ inputs.catalog_conclusion }}
          INLINE_CATALOG_RUN: ${{ inputs.inline_catalog_run }}
        run: |
          test "$CATALOG_RUN_ID" != null
          test -n "$CATALOG_RUN_ID"
          test "$CATALOG_RUN_ATTEMPT" != null
          test -n "$CATALOG_RUN_ATTEMPT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CATALOG_RUN_ID")
          test "$(jq -r .name <<<"$run")" = 'Automated plugin radar and Catalog update'
          test "$(jq -r .run_attempt <<<"$run")" = "$CATALOG_RUN_ATTEMPT"
          if test "$INLINE_CATALOG_RUN" = true; then
            test "$CATALOG_RUN_ID" = "$GITHUB_RUN_ID"
            test "$CATALOG_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            conclusion="$CATALOG_CONCLUSION"
            test -n "$conclusion"
          else
            test "$(jq -r .status <<<"$run")" = completed
            conclusion=$(jq -r '.conclusion // "unknown"' <<<"$run")
          fi
          echo "run_id=$CATALOG_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$CATALOG_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r .html_url <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Download the matching Catalog decision record
        id: catalog_report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.run_id }}
          CATALOG_RUN_ATTEMPT: ${{ steps.catalog.outputs.run_attempt }}
        run: |
          report_dir="$RUNNER_TEMP/catalog-report"
          mkdir -p "$report_dir"
          gh run download "$CATALOG_RUN_ID" \
            --name "catalog-automation-${CATALOG_RUN_ID}-${CATALOG_RUN_ATTEMPT}" \
            --dir "$report_dir"
          report_path=$(find "$report_dir" -type f -name catalog-automation-report.json -print -quit)
          test -n "$report_path"
          echo "path=$report_path" >> "$GITHUB_OUTPUT"
      - name: Download the matching author notification record
        id: author_report
        if: steps.catalog.outputs.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.run_id }}
          CATALOG_RUN_ATTEMPT: ${{ steps.catalog.outputs.run_attempt }}
        run: |
          plan_dir="$RUNNER_TEMP/author-notice-plan"
          mkdir -p "$plan_dir"
          gh run download "$CATALOG_RUN_ID" \
            --name "author-notification-plan-${CATALOG_RUN_ID}-${CATALOG_RUN_ATTEMPT}" \
            --dir "$plan_dir"
          plan_path=$(find "$plan_dir" -type f -name author-notice-plan.json -print -quit)
          test -n "$plan_path"
          jq -e --arg catalog_run_id "$CATALOG_RUN_ID" \
            '.sourceCatalogRunId == $catalog_run_id' "$plan_path" >/dev/null
          echo "path=$plan_path" >> "$GITHUB_OUTPUT"
      - name: Verify current public Catalog and Candidate surfaces
        id: public
        continue-on-error: true
        run: node scripts/verify-marketplace-public.mjs --attempts 3 --report "$RUNNER_TEMP/catalog-run-public-report.json"
      - name: Bind the current main authority for report delivery
        id: base
        run: |
          git fetch --no-tags origin main
          base_sha=$(git rev-parse HEAD)
          test "$base_sha" = "$(git rev-parse origin/main)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Render the scan report for the repository owner
        id: render
        if: always() && steps.catalog.outcome == 'success' && steps.base.outcome == 'success'
        env:
          CATALOG_REPORT_PATH: ${{ steps.catalog_report.outputs.path }}
          AUTHOR_NOTICE_PLAN_PATH: ${{ steps.author_report.outputs.path }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.run_id }}
          CATALOG_RUN_URL: ${{ steps.catalog.outputs.run_url }}
          CATALOG_RUN_CONCLUSION: ${{ steps.catalog.outputs.conclusion }}
        run: |
          args=(
            --catalog registry/catalog.json
            --output "$RUNNER_TEMP/catalog-run-report.md"
            --catalog-run-id "$CATALOG_RUN_ID"
            --catalog-run-url "$CATALOG_RUN_URL"
            --catalog-conclusion "$CATALOG_RUN_CONCLUSION"
            --watchdog-run-id "$GITHUB_RUN_ID"
            --watchdog-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --repair-triggered false
            --mention "@$GITHUB_REPOSITORY_OWNER"
          )
          if test -n "$CATALOG_REPORT_PATH" && test -f "$CATALOG_REPORT_PATH"; then
            args+=(--report "$CATALOG_REPORT_PATH")
          fi
          if test -f "$RUNNER_TEMP/catalog-run-public-report.json"; then
            args+=(--watchdog-report "$RUNNER_TEMP/catalog-run-public-report.json")
          fi
          if test -n "$AUTHOR_NOTICE_PLAN_PATH" && test -f "$AUTHOR_NOTICE_PLAN_PATH"; then
            args+=(--author-notice-plan "$AUTHOR_NOTICE_PLAN_PATH")
          fi
          node scripts/render-catalog-automation-notification.mjs "${args[@]}"
          cat "$RUNNER_TEMP/catalog-run-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$RUNNER_TEMP/catalog-run-report.md" >> "$GITHUB_OUTPUT"
      - name: Snapshot the managed report Issue
        if: steps.render.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog-report-delivery.mjs snapshot --output "$RUNNER_TEMP/catalog-report-state.json"
      - name: Create a hash-bound report delivery plan
        id: delivery_plan
        if: steps.render.outcome == 'success'
        env:
          BASE_COMMIT: ${{ steps.base.outputs.sha }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.run_id }}
          REPORT_PATH: ${{ steps.render.outputs.path }}
        run: |
          node scripts/catalog-report-delivery.mjs plan \
            --report "$REPORT_PATH" \
            --state "$RUNNER_TEMP/catalog-report-state.json" \
            --base-commit "$BASE_COMMIT" \
            --catalog-run-id "$CATALOG_RUN_ID" \
            --delivery-key "catalog-$CATALOG_RUN_ID" \
            --output "$RUNNER_TEMP/catalog-report-delivery-plan.json"
          jq -r '"plan_id=\(.planId)", "action=\(.action.type)"' \
            "$RUNNER_TEMP/catalog-report-delivery-plan.json" >> "$GITHUB_OUTPUT"
      - name: Publish one owner report for this Catalog run
        if: steps.delivery_plan.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.render.outputs.path }}
        run: |
          node scripts/catalog-report-delivery.mjs apply \
            --plan "$RUNNER_TEMP/catalog-report-delivery-plan.json" \
            --report "$REPORT_PATH"
      - name: Preserve the report and delivery decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-run-report-${{ steps.catalog.outputs.run_id || github.run_id }}-${{ steps.catalog.outputs.run_attempt || github.run_attempt }}
          path: |
            ${{ runner.temp }}/catalog-run-report.md
            ${{ runner.temp }}/catalog-report-delivery-plan.json
            ${{ runner.temp }}/catalog-run-public-report.json
          if-no-files-found: warn
          retention-days: 30
