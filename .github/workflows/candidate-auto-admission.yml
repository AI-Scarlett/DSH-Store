name: Candidate auto admission

on:
  workflow_run:
    workflows: ["Candidate compatibility probe (dry run)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: catalog-automation
  cancel-in-progress: false

jobs:
  admit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the fresh main authority for this run
        id: base
        run: |
          git fetch --no-tags origin main
          base_sha=$(git rev-parse HEAD)
          test "$base_sha" = "$(git rev-parse origin/main)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Download probe evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          gh run download "$PROBE_RUN_ID" -n candidate-compatibility-probe -D "$RUNNER_TEMP/probe"
          test -f "$RUNNER_TEMP/probe/compatibility.json"
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/probe/compatibility.json","utf8"));console.log(`probe ${p.repository}@${p.commit} ${Array.isArray(p.results)?p.results.length:0} results`)'
      - name: Validate the current authority before admission
        run: npm run validate:registry
      - name: Apply candidate auto admission
        id: automate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          catalog_sha=$(sha256sum registry/catalog.json | cut -d ' ' -f 1)
          catalog_index_sha=$(sha256sum registry/catalog-index.json | cut -d ' ' -f 1)
          candidates_sha=$(sha256sum registry/candidates.json | cut -d ' ' -f 1)
          recommendations_sha=$(sha256sum registry/community-recommendations.json | cut -d ' ' -f 1)
          observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node scripts/automate-catalog.mjs \
            --candidate-auto-admission \
            --candidate-probe "$RUNNER_TEMP/probe/compatibility.json" \
            --write \
            --expected-catalog-sha "$catalog_sha" \
            --expected-catalog-index-sha "$catalog_index_sha" \
            --expected-candidates-sha "$candidates_sha" \
            --expected-recommendations-sha "$recommendations_sha" \
            --catalog-backup "$RUNNER_TEMP/catalog.before.json" \
            --catalog-index-backup "$RUNNER_TEMP/catalog-index.before.json" \
            --catalog-details-backup "$RUNNER_TEMP/catalog-details.before" \
            --candidates-backup "$RUNNER_TEMP/candidates.before.json" \
            --recommendations-backup "$RUNNER_TEMP/community-recommendations.before.json" \
            --observed-at "$observed_at" \
            --report "$RUNNER_TEMP/candidate-admission-report.json"
          if git diff --quiet -- registry/catalog.json registry/catalog-index.json registry/catalog/details registry/candidates.json registry/community-recommendations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the complete repository after admission
        if: steps.automate.outputs.changed == 'true'
        run: npm run check
      - name: Create the candidate admission pull request and merge after checks
        if: steps.automate.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          test "$CATALOG_BASE_COMMIT" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          branch="automation/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$CATALOG_BASE_COMMIT" >/dev/null
          cleanup_branch() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true; }
          trap cleanup_branch ERR
          CATALOG_BRANCH="$branch" node scripts/create-catalog-commit.mjs --output "$RUNNER_TEMP/create-catalog-commit-response.json"
          commit_oid=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/create-catalog-commit-response.json")
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "chore: auto-admit probed plugin candidate" \
            --body "Generated by the candidate auto-admission path. It re-ran the fixed-source precheck and policy analysis for the probed repository at its fixed Commit, required latest-three host-boot compatibility, and applied only the accepted candidate to the Catalog. The probe ran on an isolated read-only runner with no secrets. The PR passed npm run check and CodeQL before merge.")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh workflow run registry.yml --ref "$branch"
          validation_run_id=''
          for attempt in $(seq 1 30); do
            validation_run_id=$(gh run list --workflow registry.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId,headSha --jq ".[] | select(.headSha == \"$commit_oid\") | .databaseId" | head -n 1)
            test -n "$validation_run_id" && break
            sleep 2
          done
          test -n "$validation_run_id"
          gh run watch "$validation_run_id" --exit-status --interval 10
          codeql_ready=false
          for attempt in $(seq 1 90); do
            checks=$(gh pr checks "$pr_url" --json name,state,bucket || true)
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")
            codeql_passed=$(jq '[.[] | select((.name == "Analyze (actions)" or .name == "Analyze (javascript-typescript)") and .bucket == "pass")] | length' <<<"$checks")
            test "$failed" -eq 0
            if test "$pending" -eq 0 && test "$codeql_passed" -eq 2; then codeql_ready=true; break; fi
            sleep 10
          done
          test "$codeql_ready" = true
          test "$CATALOG_BASE_COMMIT" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          gh pr merge --squash --delete-branch --match-head-commit "$commit_oid" "$pr_url"
          test "$(gh pr view "$pr_url" --json state --jq .state)" = MERGED
          merge_sha=$(gh pr view "$pr_url" --json mergeCommit --jq '.mergeCommit.oid')
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq '.commit.verification.verified')" = true
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          trap - ERR
      - name: Preserve the decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-auto-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-admission-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the merged Catalog immediately
        if: steps.automate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.pull_request.outputs.merge_sha }}
        run: |
          test "$EXPECTED_MAIN_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          dispatched_at=$(date -u +%s)
          gh workflow run pages.yml --ref main
          pages_run_id=''
          for attempt in $(seq 1 30); do
            runs=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt)
            pages_run_id=$(jq -r --arg sha "$EXPECTED_MAIN_SHA" --argjson dispatched_at "$dispatched_at" '.[] | select(.headSha == $sha and (.createdAt | fromdateiso8601) >= $dispatched_at) | .databaseId' <<<"$runs" | head -n 1)
            test -n "$pages_run_id" && break
            sleep 2
          done
          test -n "$pages_run_id"
          gh run watch "$pages_run_id" --exit-status --interval 10
