name: Three-hour marketplace watchdog

on:
  schedule:
    # A half-hour pulse catches up after GitHub drops a scheduled event.
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation identifier
        required: false
        default: manual
        type: string
  workflow_run:
    workflows: [Publish plugin marketplace]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: marketplace-watchdog
  cancel-in-progress: false

jobs:
  cadence:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Check whether a complete three-hour patrol is due
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_success=''
          history_known=true

          if test "$GITHUB_EVENT_NAME" = schedule || test "$GITHUB_EVENT_NAME" = workflow_run; then
            if ! runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/marketplace-watchdog.yml/runs?per_page=100&status=completed"); then
              history_known=false
            else
              while IFS= read -r run_id; do
                test -n "$run_id" || continue
                if ! jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100"); then
                  history_known=false
                  break
                fi
                if ! last_success=$(jq -r '[.jobs[] | select(.name == "verify-and-repair" and .conclusion == "success") | .completed_at][0] // empty' <<<"$jobs"); then
                  history_known=false
                  break
                fi
                test -z "$last_success" || break
              done < <(jq -r --argjson current_run "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id != $current_run and .conclusion == "success") | .id' <<<"$runs")
            fi
          fi

          if test "$history_known" != true; then
            echo "::warning::Previous patrol history could not be read; running a fresh verification."
            last_success=''
          fi

          decision=$(LAST_SUCCESSFUL_WATCHDOG_AT="$last_success" node scripts/marketplace-watchdog-cadence.mjs)
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$decision" >> "$GITHUB_STEP_SUMMARY"

  verify-and-repair:
    needs: cadence
    if: ${{ needs.cadence.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and wait for the exact Catalog run
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          request_id="watchdog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Ignore push and pull-request validation runs for this workflow. They
          # are not Catalog policy decisions and must not trigger a repair run.
          catalog_runs=$(gh run list --workflow catalog-automation.yml --limit 100 \
            --json databaseId,event,displayTitle \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch") | select(.displayTitle | startswith("Catalog automation ("))]')
          latest=$(jq -c '.[0] // empty' <<<"$catalog_runs")
          # A cancelled run makes no Catalog decision. Fall back to the prior
          # policy run so an intentional stop does not start broad discovery.
          if test -n "$latest" && test "$(jq -r '.conclusion // ""' <<<"$latest")" = cancelled; then
            latest=$(jq -c '.[1] // empty' <<<"$catalog_runs")
          fi
          latest_id=''
          if test -n "$latest"; then
            latest_id=$(jq -r '.databaseId // empty' <<<"$latest")
          fi
          repair=false

          if test -n "$latest_id"; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest_id")
            status=$(jq -r .status <<<"$latest")
            conclusion=$(jq -r '.conclusion // "unknown"' <<<"$latest")
            created=$(jq -r .created_at <<<"$latest")
            age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))

            if test "$status" != completed && test "$age" -le 32400; then
              for attempt in $(seq 1 120); do
                latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest_id")
                status=$(jq -r .status <<<"$latest")
                test "$status" = completed && break
                sleep 15
              done
              conclusion=$(jq -r '.conclusion // "unknown"' <<<"$latest")
            fi

            if test "$status" = completed && test "$conclusion" = success && test "$age" -le 32400; then
              target_id="$latest_id"
            elif test "$status" != completed && test "$age" -le 32400; then
              target_id="$latest_id"
            else
              repair=true
            fi
          else
            repair=true
          fi

          if test "$repair" = true; then
            gh workflow run catalog-automation.yml --ref main -f request_id="$request_id"
            expected_title="Catalog automation ($request_id)"
            target_id=''
            for attempt in $(seq 1 60); do
              runs=$(gh run list --workflow catalog-automation.yml --event workflow_dispatch --limit 20 \
                --json databaseId,displayTitle)
              target_id=$(jq -r --arg expected "$expected_title" \
                '.[] | select(.displayTitle == $expected) | .databaseId' <<<"$runs" | head -n 1)
              test -n "$target_id" && break
              sleep 5
            done
            test -n "$target_id"

            for attempt in $(seq 1 360); do
              target=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_id")
              status=$(jq -r .status <<<"$target")
              test "$status" = completed && break
              sleep 15
            done
          else
            target=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_id")
          fi

          status=$(jq -r .status <<<"$target")
          conclusion=$(jq -r '.conclusion // "unknown"' <<<"$target")
          run_attempt=$(jq -r .run_attempt <<<"$target")
          test -n "$run_attempt"
          echo "repair=$repair" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "report_run_id=$target_id" >> "$GITHUB_OUTPUT"
          echo "report_run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "report_run_url=$(jq -r .html_url <<<"$target")" >> "$GITHUB_OUTPUT"
          echo "report_run_status=$status" >> "$GITHUB_OUTPUT"
          echo "report_run_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Directly invoke the owner report for the repaired Catalog run
        id: owner_report
        if: steps.catalog.outputs.repair == 'true' && steps.catalog.outputs.report_run_status == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.report_run_id }}
          CATALOG_RUN_ATTEMPT: ${{ steps.catalog.outputs.report_run_attempt }}
          REQUEST_ID: ${{ steps.catalog.outputs.request_id }}-owner-report
        run: |
          gh workflow run catalog-run-report.yml --ref main \
            -f catalog_run_id="$CATALOG_RUN_ID" \
            -f catalog_run_attempt="$CATALOG_RUN_ATTEMPT" \
            -f request_id="$REQUEST_ID"
          expected_title="Owner report for Catalog run ${CATALOG_RUN_ID} (${REQUEST_ID})"
          report_run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh run list --workflow catalog-run-report.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle)
            report_run_id=$(jq -r --arg expected "$expected_title" \
              '.[] | select(.displayTitle == $expected) | .databaseId' <<<"$runs" | head -n 1)
            test -n "$report_run_id" && break
            sleep 5
          done
          test -n "$report_run_id"
          for attempt in $(seq 1 80); do
            report_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$report_run_id")
            status=$(jq -r .status <<<"$report_run")
            test "$status" = completed && break
            sleep 15
          done
          test "$(jq -r .status <<<"$report_run")" = completed
          echo "run_id=$report_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r .html_url <<<"$report_run")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion // "unknown"' <<<"$report_run")" >> "$GITHUB_OUTPUT"
      - name: Verify GitHub, Pages, international, and domestic Catalog and Candidate Registries
        id: public
        continue-on-error: true
        run: node scripts/verify-marketplace-public.mjs --attempts 3 --report "$RUNNER_TEMP/marketplace-watchdog-report.json"
      - name: Repair the public build and wait for its exact deployment
        id: pages_repair
        if: steps.public.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          request_id="watchdog-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run pages.yml --ref main -f request_id="$request_id"
          expected_title="Publish plugin marketplace ($request_id)"
          pages_run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 50 \
              --json databaseId,displayTitle)
            pages_run_id=$(jq -r --arg expected "$expected_title" \
              '.[] | select(.displayTitle == $expected) | .databaseId' <<<"$runs" | head -n 1)
            test -n "$pages_run_id" && break
            sleep 5
          done
          test -n "$pages_run_id"

          pages_run=''
          for attempt in $(seq 1 180); do
            pages_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pages_run_id")
            test "$(jq -r .status <<<"$pages_run")" = completed && break
            sleep 15
          done
          test "$(jq -r .status <<<"$pages_run")" = completed
          test "$(jq -r .conclusion <<<"$pages_run")" = success
          echo "run_id=$pages_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r .html_url <<<"$pages_run")" >> "$GITHUB_OUTPUT"
      - name: Reverify the public surfaces after repair
        id: public_after_repair
        if: steps.public.outcome != 'success' && steps.pages_repair.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-marketplace-public.mjs --attempts 3 --report "$RUNNER_TEMP/marketplace-watchdog-report.json"
      - name: Select the final public verification result
        id: final_public
        if: always()
        env:
          INITIAL_PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          REPAIRED_PUBLIC_OUTCOME: ${{ steps.public_after_repair.outcome }}
        run: |
          outcome="$INITIAL_PUBLIC_OUTCOME"
          if test "$REPAIRED_PUBLIC_OUTCOME" = success; then outcome=success; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Download the exact Catalog decision record
        id: catalog_report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ steps.catalog.outputs.report_run_id }}
          REPORT_RUN_ATTEMPT: ${{ steps.catalog.outputs.report_run_attempt }}
        run: |
          test -n "$REPORT_RUN_ID"
          test -n "$REPORT_RUN_ATTEMPT"
          report_dir="$RUNNER_TEMP/catalog-automation-report"
          mkdir -p "$report_dir"
          gh run download "$REPORT_RUN_ID" \
            --name "catalog-automation-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}" \
            --dir "$report_dir"
          report_path=$(find "$report_dir" -type f -name catalog-automation-report.json -print -quit)
          test -n "$report_path"
          echo "path=$report_path" >> "$GITHUB_OUTPUT"
      - name: Download the exact author notification record
        id: author_report
        if: always() && steps.catalog.outputs.report_run_conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ steps.catalog.outputs.report_run_id }}
          REPORT_RUN_ATTEMPT: ${{ steps.catalog.outputs.report_run_attempt }}
        run: |
          test -n "$REPORT_RUN_ID"
          test -n "$REPORT_RUN_ATTEMPT"
          plan_dir="$RUNNER_TEMP/author-notice-plan"
          mkdir -p "$plan_dir"
          gh run download "$REPORT_RUN_ID" \
            --name "author-notification-plan-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}" \
            --dir "$plan_dir"
          plan_path=$(find "$plan_dir" -type f -name author-notice-plan.json -print -quit)
          test -n "$plan_path"
          jq -e --arg catalog_run_id "$REPORT_RUN_ID" \
            '.sourceCatalogRunId == $catalog_run_id' "$plan_path" >/dev/null
          echo "path=$plan_path" >> "$GITHUB_OUTPUT"
      - name: Render the Chinese update and verification report
        id: notification_report
        if: always()
        env:
          CATALOG_REPORT_PATH: ${{ steps.catalog_report.outputs.path }}
          CATALOG_RUN_ID: ${{ steps.catalog.outputs.report_run_id }}
          CATALOG_RUN_URL: ${{ steps.catalog.outputs.report_run_url }}
          CATALOG_RUN_CONCLUSION: ${{ steps.catalog.outputs.report_run_conclusion }}
          REPAIR_TRIGGERED: ${{ steps.catalog.outputs.repair }}
          AUTHOR_NOTICE_PLAN_PATH: ${{ steps.author_report.outputs.path }}
        run: |
          args=(
            --catalog registry/catalog.json
            --output "$RUNNER_TEMP/catalog-automation-notification.md"
            --catalog-run-id "${CATALOG_RUN_ID:-unknown}"
            --catalog-run-url "${CATALOG_RUN_URL:-https://github.com/$GITHUB_REPOSITORY/actions}"
            --catalog-conclusion "${CATALOG_RUN_CONCLUSION:-unknown}"
            --watchdog-run-id "$GITHUB_RUN_ID"
            --watchdog-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --repair-triggered "${REPAIR_TRIGGERED:-false}"
            --mention "@$GITHUB_REPOSITORY_OWNER"
          )
          if test -n "$CATALOG_REPORT_PATH" && test -f "$CATALOG_REPORT_PATH"; then
            args+=(--report "$CATALOG_REPORT_PATH")
          fi
          if test -f "$RUNNER_TEMP/marketplace-watchdog-report.json"; then
            args+=(--watchdog-report "$RUNNER_TEMP/marketplace-watchdog-report.json")
          fi
          if test -n "$AUTHOR_NOTICE_PLAN_PATH" && test -f "$AUTHOR_NOTICE_PLAN_PATH"; then
            args+=(--author-notice-plan "$AUTHOR_NOTICE_PLAN_PATH")
          fi
          node scripts/render-catalog-automation-notification.mjs "${args[@]}"
          cat "$RUNNER_TEMP/catalog-automation-notification.md" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$RUNNER_TEMP/catalog-automation-notification.md" >> "$GITHUB_OUTPUT"
      - name: Snapshot the managed report Issue
        if: always() && steps.notification_report.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog-report-delivery.mjs snapshot --output "$RUNNER_TEMP/catalog-report-state.json"
      - name: Create a hash-bound watchdog report delivery plan
        id: delivery_plan
        if: always() && steps.notification_report.outcome == 'success'
        env:
          REPORT_PATH: ${{ steps.notification_report.outputs.path }}
          REPORT_RUN_ID: ${{ steps.catalog.outputs.report_run_id }}
          REPORT_RUN_CONCLUSION: ${{ steps.catalog.outputs.report_run_conclusion }}
          PUBLIC_OUTCOME: ${{ steps.final_public.outputs.outcome }}
          OWNER_REPORT_CONCLUSION: ${{ steps.owner_report.outputs.conclusion }}
          REPAIR_TRIGGERED: ${{ steps.catalog.outputs.repair }}
        run: |
          delivery_key="catalog-$REPORT_RUN_ID"
          if test "$REPORT_RUN_CONCLUSION" != success || test "$PUBLIC_OUTCOME" != success; then
            delivery_key="${delivery_key}-watchdog-alert"
          elif test "$REPAIR_TRIGGERED" = true && test "$OWNER_REPORT_CONCLUSION" != success; then
            delivery_key="${delivery_key}-watchdog-alert"
          elif jq -e --arg marker "<!-- dsh-catalog-report:v1:${delivery_key}-watchdog-alert -->" \
            '.issue.comments[]?.body | contains($marker)' \
            "$RUNNER_TEMP/catalog-report-state.json" >/dev/null; then
            delivery_key="${delivery_key}-watchdog-alert"
          fi
          git fetch --no-tags origin main
          base_commit=$(git rev-parse FETCH_HEAD)
          node scripts/catalog-report-delivery.mjs plan \
            --report "$REPORT_PATH" \
            --state "$RUNNER_TEMP/catalog-report-state.json" \
            --base-commit "$base_commit" \
            --catalog-run-id "$REPORT_RUN_ID" \
            --delivery-key "$delivery_key" \
            --output "$RUNNER_TEMP/catalog-report-delivery-plan.json"
      - name: Publish the report through GitHub notification email
        if: always() && steps.delivery_plan.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.notification_report.outputs.path }}
        run: |
          node scripts/catalog-report-delivery.mjs apply \
            --plan "$RUNNER_TEMP/catalog-report-delivery-plan.json" \
            --report "$REPORT_PATH"
      - name: Preserve the public verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/marketplace-watchdog-report.json
            ${{ runner.temp }}/catalog-report-delivery-plan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep unresolved repair visible to the next run
        if: >-
          steps.catalog.outputs.report_run_status != 'completed' ||
          steps.catalog.outputs.report_run_conclusion != 'success' ||
          steps.final_public.outputs.outcome != 'success' ||
          (steps.catalog.outputs.repair == 'true' && steps.owner_report.outputs.conclusion != 'success')
        run: exit 1
