name: Dispatch candidate compatibility probes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - registry/candidates.json

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select candidates awaiting a probe
        id: find
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const registry = JSON.parse(fs.readFileSync('registry/candidates.json', 'utf8'))
          const selected = (registry.entries || [])
            .filter(entry => entry && entry.status === 'discovered'
              && typeof entry.repositoryUrl === 'string'
              && /^[0-9a-f]{40}$/.test(String(entry.latestCommit)))
            .slice(0, 3)
            .map(entry => ({ repository: entry.name, commit: entry.latestCommit }))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: selected })}\n`)
          console.log(`candidates awaiting probe: ${selected.length}`)
          NODE

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.matrix != '' && needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
        run: |
          gh workflow run candidate-compatibility-probe.yml --ref main \
            -f repository="$REPOSITORY" -f commit="$COMMIT"
