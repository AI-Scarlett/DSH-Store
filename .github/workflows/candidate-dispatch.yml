name: Dispatch candidate compatibility probes

on:
  push:
    branches: [main]
    paths:
      - registry/candidates.json

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find newly added candidates
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const before = process.env.BEFORE
          const read = ref => {
            try { return JSON.parse(execFileSync('git', ['show', `${ref}:registry/candidates.json`], { encoding: 'utf8' })) }
            catch { return { entries: [] } }
          }
          const head = read(process.env.AFTER)
          const base = read(before)
          const known = new Set((base.entries || []).map(entry => String(entry?.repositoryUrl || '').toLowerCase()).filter(Boolean))
          const added = (head.entries || [])
            .filter(entry => entry && typeof entry.repositoryUrl === 'string' && /^[0-9a-f]{40}$/.test(String(entry.latestCommit)) && !known.has(entry.repositoryUrl.toLowerCase()))
            .slice(0, 3)
            .map(entry => ({ repository: entry.name, commit: entry.latestCommit }))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: added })}\n`)
          console.log(`new candidates: ${added.length}`)
          NODE

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.matrix != '' && needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Dispatch probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
        run: |
          gh workflow run candidate-compatibility-probe.yml --ref main \
            -f repository="$REPOSITORY" -f commit="$COMMIT"
