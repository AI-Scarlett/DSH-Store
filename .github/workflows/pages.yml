name: Publish plugin marketplace

on:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "registry/**"
      - "scripts/build-marketplace-static.mjs"
      - "src/automation-status.mjs"
      - "scripts/submit-indexnow.mjs"
      - "package.json"
      - "test/marketplace-static-build.test.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Validate repository contracts
        run: npm run check
      - name: Collect recent automation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scanner=$(gh run list --workflow catalog-automation.yml --limit 8 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha)
          watchdog=$(gh run list --workflow marketplace-watchdog.yml --limit 8 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha)
          jq -n --argjson scanner "$scanner" --argjson watchdog "$watchdog" \
            '{catalogAutomation: $scanner, marketplaceWatchdog: $watchdog}' \
            > "$RUNNER_TEMP/automation-runs.json"
          mkdir -p "$RUNNER_TEMP/catalog-automation-reports"
          jq -r '.[].databaseId' <<<"$scanner" | while read -r run_id; do
            mkdir -p "$RUNNER_TEMP/catalog-automation-reports/$run_id"
            gh run download "$run_id" --dir "$RUNNER_TEMP/catalog-automation-reports/$run_id" || true
          done
      - name: Build public marketplace artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:marketplace -- --enrich-github --source-sha "$GITHUB_SHA" --automation-runs "$RUNNER_TEMP/automation-runs.json" --automation-reports "$RUNNER_TEMP/catalog-automation-reports"
      - name: Build domestic marketplace artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build:marketplace -- --enrich-github --source-sha "$GITHUB_SHA" --site-origin https://dsh-store.cn --alternate-origin https://dsh.store --icp 鄂ICP备2026010180号-2 --out _site-domestic --automation-runs "$RUNNER_TEMP/automation-runs.json" --automation-reports "$RUNNER_TEMP/catalog-automation-reports"
          mkdir -p _site/domestic
          cp -a _site-domestic/. _site/domestic/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
