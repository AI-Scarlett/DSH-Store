name: Publish plugin marketplace

on:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "registry/**"
      - "scripts/build-marketplace-static.mjs"
      - "scripts/marketplace-seo-pages.mjs"
      - "scripts/submit-indexnow.mjs"
      - "package.json"
      - "test/marketplace-static-build.test.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Validate repository contracts
        run: npm run check
      - name: Build public marketplace artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:marketplace -- --enrich-github --source-sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
