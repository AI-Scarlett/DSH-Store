name: Publish plugin marketplace

on:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "registry/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build public marketplace artifact
        run: |
          mkdir -p _site
          cp -R marketplace registry _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=marketplace/">
          <title>DSH Plugin Marketplace</title>
          <a href="marketplace/">打开 DSH Plugin Marketplace</a>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
