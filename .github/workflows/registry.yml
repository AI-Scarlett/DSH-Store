      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-096-catalog-20261016.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-097-catalog-20261016.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-098-catalog-20261017.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0911-catalog-20261028.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0912-catalog-20261030.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0915-catalog-20261030.json
