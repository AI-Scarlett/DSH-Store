name: Registry validation

on:
  workflow_dispatch:
  pull_request:
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]
  push:
    branches: [main]
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:admission-plan
      - run: node scripts/verify-author-feedback-plan.mjs
      - run: npm run check
      - run: npm run verify:registry-sources
