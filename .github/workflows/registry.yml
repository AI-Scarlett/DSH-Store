      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0926-catalog-20261102.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0927-catalog-20261102.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0929-catalog-20261102.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0930-catalog-20261102.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0931-catalog-20261103.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0934-catalog-20261103.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0935-catalog-20261103.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-0936-catalog-20261103.json
      - run: node scripts/verify-catalog-repair-plan.mjs
      - run: npm run check
      - name: Validate native index with the pinned official parser
        run: |
          npm install --prefix "$RUNNER_TEMP/native-validator" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@0.2.1-alpha.4
          node scripts/verify-native-market-official.mjs "$RUNNER_TEMP/native-validator/node_modules/@deepseek-ai/dsh-plugin-market-index/lib/index.js"
      - run: npm run verify:registry-sources
