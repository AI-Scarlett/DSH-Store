name: Registry validation

on:
  pull_request:
    paths: ["registry/**", "src/catalog.mjs", "scripts/validate-registry.mjs"]
  push:
    branches: [main]
    paths: ["registry/**", "src/catalog.mjs", "scripts/validate-registry.mjs"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:registry
      - run: npm run verify:registry-sources
