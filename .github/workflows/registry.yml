name: Registry validation

on:
  workflow_dispatch:
  pull_request:
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]
  push:
    branches: [main]
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:admission-plan
      - run: node scripts/verify-author-feedback-plan.mjs
      - run: node scripts/verify-dsh-upgrade-plan.mjs
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-fixture-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-layout-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-standards-feedback-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-rc1-repair-20261017.json
      - run: node scripts/verify-store-release-plan.mjs
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-096-catalog-20261016.json
      - run: node scripts/verify-store-release-plan.mjs docs/ops/store-097-catalog-20261016.json
      - run: node scripts/verify-catalog-repair-plan.mjs
      - run: npm run check
      - name: Validate native index with the pinned official parser
        run: |
          npm install --prefix "$RUNNER_TEMP/native-validator" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-plugin-market-index@0.2.1-alpha.4
          node scripts/verify-native-market-official.mjs "$RUNNER_TEMP/native-validator/node_modules/@deepseek-ai/dsh-plugin-market-index/lib/index.js"
      - run: npm run verify:registry-sources
