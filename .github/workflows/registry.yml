name: Registry validation

on:
  workflow_dispatch:
  pull_request:
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]
  push:
    branches: [main]
    paths: ["registry/**", "src/**", "bin/**", "scripts/**", "test/**", "marketplace/**", "install-counter/**", "package.json", ".github/workflows/registry.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:admission-plan
      - run: node scripts/verify-author-feedback-plan.mjs
      - run: node scripts/verify-dsh-upgrade-plan.mjs
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-fixture-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-layout-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-standards-feedback-20261016.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-rc1-repair-20261017.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-rc4-desktop-20261027.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-alpha2-desktop-20261028.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-rc5-desktop-20261030.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-store-20261030.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-remote-bridge-20261030.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-buttons-20261031.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-authority-20261031.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-authority-20261101.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-blocked-check-20261101.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-install-outcome-20261101.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-update-20261101.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-home-nav-update-20261102.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-full-directory-20261102.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-github-install-20261102.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-ranking-ui-20261103.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-guidance-ranking-20261103.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-store-icon-20261103.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-ui-polish-20261103.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-self-update-20261102.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-interactions-20261102.json
      - run: node scripts/verify-dsh-upgrade-plan.mjs docs/ops/dsh-native-market-desktop-ui-20261031.json
