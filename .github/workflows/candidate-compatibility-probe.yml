name: Candidate compatibility probe (dry run)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Candidate repository in owner/repo form
        required: true
        type: string
      commit:
        description: Full 40-character fixed commit
        required: true
        type: string
      versions:
        description: Comma-separated official DSH versions (default latest-three)
        required: false
        default: 0.2.2-rc.5,0.2.2-rc.4,0.2.2-rc.3
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Config-composition probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          REPOSITORY: ${{ inputs.repository }}
          COMMIT: ${{ inputs.commit }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          node - <<'NODE'
          const repository = process.env.REPOSITORY || ''
          const commit = process.env.COMMIT || ''
          const versions = (process.env.VERSIONS || '').split(',').map(v => v.trim()).filter(Boolean)
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) throw new Error('repository must be owner/repo')
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('commit must be a full 40-character SHA')
          if (versions.length < 1 || versions.length > 3) throw new Error('versions must contain 1 to 3 values')
          if (versions.some(v => !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v))) throw new Error('invalid DSH version')
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm (the DSH CLI forwards package operations to pnpm)
        run: npm install --global pnpm@10.32.1
      - name: Probe each DSH version
        env:
          REPOSITORY: ${{ inputs.repository }}
          COMMIT: ${{ inputs.commit }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          results='[]'
          IFS=',' read -r -a versions <<< "$VERSIONS"
          for raw in "${versions[@]}"; do
            version="$(echo "$raw" | xargs)"
            [ -z "$version" ] && continue
            work="$RUNNER_TEMP/probe/$version"
            mkdir -p "$work/home" "$work/runtime"
            status="unknown"
            method="none"
            detail=""
            if timeout 300 npm install --no-audit --no-fund --prefix "$work/runtime" "@deepseek-ai/dsh@$version" >"$work/install.log" 2>&1; then
              cli="$work/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"
              if [ -f "$cli" ] && node "$cli" --version >"$work/version.log" 2>&1; then
                export DSH_HOME="$work/home"
                if timeout 300 node "$cli" plugin --profile probe add "github:$REPOSITORY#$COMMIT" --ignore-scripts >"$work/add.log" 2>&1; then
                  if timeout 120 node "$cli" --profile probe --dump-config >"$work/dump.txt" 2>"$work/dump.err"; then
                    if timeout 300 node "$cli" plugin --profile probe add "@deepseek-ai/dsh-web-app@$version" --ignore-scripts >>"$work/add.log" 2>&1; then
                      node "$cli" --profile probe --host 127.0.0.1 --port 0 --no-open >"$work/boot.log" 2>&1 &
                      boot_pid=$!
                      boot_ok=false
                      for _ in $(seq 1 60); do
                        if grep -q "dsh web:" "$work/boot.log" 2>/dev/null && kill -0 "$boot_pid" 2>/dev/null; then
                          sleep 5
                          kill -0 "$boot_pid" 2>/dev/null && boot_ok=true
                          break
                        fi
                        kill -0 "$boot_pid" 2>/dev/null || break
                        sleep 1
                      done
                      kill "$boot_pid" 2>/dev/null || true
                      wait "$boot_pid" 2>/dev/null || true
                      if [ "$boot_ok" = true ]; then
                        status="compatible"
                        method="host-boot"
                        detail="candidate bundle loaded in a real DSH host for this version"
                      else
                        status="incompatible"
                        detail="host boot failed: $(tail -c 400 "$work/boot.log" | tr '\n' ' ')"
                      fi
                    else
                      status="incompatible"
                      detail="web-app bundle install failed: $(tail -c 400 "$work/add.log" | tr '\n' ' ')"
                    fi
                  else
                    status="incompatible"
                    detail="--dump-config failed: $(tail -c 400 "$work/dump.err" | tr '\n' ' ')"
                  fi
                else
                  status="incompatible"
                  detail="plugin add failed: $(tail -c 400 "$work/add.log" | tr '\n' ' ')"
                fi
              else
                detail="official DSH CLI unavailable"
              fi
            else
              detail="official DSH install failed"
            fi
            results=$(node -e 'const fs=require("fs");const rows=JSON.parse(process.argv[1]);rows.push({version:process.argv[2],status:process.argv[3],method:process.argv[4],detail:process.argv[5]});process.stdout.write(JSON.stringify(rows))' "$results" "$version" "$status" "$method" "$detail")
          done
          node -e 'const fs=require("fs");const rows=JSON.parse(process.argv[1]);fs.writeFileSync(process.argv[2],JSON.stringify({schemaVersion:1,repository:process.argv[3],commit:process.argv[4],probedAt:new Date().toISOString(),mode:"dump-config-dry-run",results:rows},null,2)+"\n")' "$results" "$RUNNER_TEMP/probe/compatibility.json" "$REPOSITORY" "$COMMIT"
      - name: Print compatibility result
        run: cat "$RUNNER_TEMP/probe/compatibility.json"
      - name: Upload compact probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-compatibility-probe
          path: |
            ${{ runner.temp }}/probe/compatibility.json
            ${{ runner.temp }}/probe/**/*.log
            ${{ runner.temp }}/probe/**/*.err
          if-no-files-found: error
          retention-days: 14

  admission:
    needs: probe
    if: needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only one candidate admission may write the Catalog at a time. Without
    # this group, parallel probes all pinned the same base Commit, so the
    # first merge invalidated the others and their admission pull requests
    # were closed unmerged instead of being retried against the new main.
    # The group is scoped to this job so probing itself stays parallel.
    concurrency:
      group: catalog-automation
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the fresh main authority for this run
        id: base
        run: |
          git fetch --no-tags origin main
          base_sha=$(git rev-parse HEAD)
          test "$base_sha" = "$(git rev-parse origin/main)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Download probe evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-compatibility-probe
          path: ${{ runner.temp }}/probe
      - name: Validate the current authority before admission
        run: npm run validate:registry
      - name: Apply candidate auto admission
        id: automate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          catalog_sha=$(sha256sum registry/catalog.json | cut -d ' ' -f 1)
          catalog_index_sha=$(sha256sum registry/catalog-index.json | cut -d ' ' -f 1)
          candidates_sha=$(sha256sum registry/candidates.json | cut -d ' ' -f 1)
          recommendations_sha=$(sha256sum registry/community-recommendations.json | cut -d ' ' -f 1)
          observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node scripts/automate-catalog.mjs \
            --candidate-auto-admission \
            --candidate-probe "$RUNNER_TEMP/probe/compatibility.json" \
            --write \
            --expected-catalog-sha "$catalog_sha" \
            --expected-catalog-index-sha "$catalog_index_sha" \
            --expected-candidates-sha "$candidates_sha" \
            --expected-recommendations-sha "$recommendations_sha" \
            --catalog-backup "$RUNNER_TEMP/catalog.before.json" \
            --catalog-index-backup "$RUNNER_TEMP/catalog-index.before.json" \
            --catalog-details-backup "$RUNNER_TEMP/catalog-details.before" \
            --candidates-backup "$RUNNER_TEMP/candidates.before.json" \
            --recommendations-backup "$RUNNER_TEMP/community-recommendations.before.json" \
            --observed-at "$observed_at" \
            --report "$RUNNER_TEMP/candidate-admission-report.json"
          if git diff --quiet -- registry/catalog.json registry/catalog-index.json registry/catalog/details registry/candidates.json registry/community-recommendations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the complete repository after admission
        if: steps.automate.outputs.changed == 'true'
        run: npm run check
      - name: Create the candidate admission pull request and merge after checks
        if: steps.automate.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          test "$CATALOG_BASE_COMMIT" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          branch="automation/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$CATALOG_BASE_COMMIT" >/dev/null
          cleanup_branch() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true; }
          trap cleanup_branch ERR
          CATALOG_BRANCH="$branch" node scripts/create-catalog-commit.mjs --output "$RUNNER_TEMP/create-catalog-commit-response.json"
          commit_oid=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/create-catalog-commit-response.json")
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "chore: auto-admit probed plugin candidate" \
            --body "Generated by the candidate auto-admission path. It re-ran the fixed-source precheck and policy analysis for the probed repository at its fixed Commit, required latest-three host-boot compatibility, and applied only the accepted candidate to the Catalog. The probe ran on an isolated read-only runner with no secrets. The PR passed npm run check and CodeQL before merge.")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh workflow run registry.yml --ref "$branch"
          validation_run_id=''
          for attempt in $(seq 1 30); do
            validation_run_id=$(gh run list --workflow registry.yml --branch "$branch" --event workflow_dispatch --limit 1 --json databaseId,headSha --jq ".[] | select(.headSha == \"$commit_oid\") | .databaseId" | head -n 1)
            test -n "$validation_run_id" && break
            sleep 2
          done
          test -n "$validation_run_id"
          gh run watch "$validation_run_id" --exit-status --interval 10
          codeql_ready=false
          for attempt in $(seq 1 90); do
            checks=$(gh pr checks "$pr_url" --json name,state,bucket || true)
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")
            codeql_passed=$(jq '[.[] | select((.name == "Analyze (actions)" or .name == "Analyze (javascript-typescript)") and .bucket == "pass")] | length' <<<"$checks")
            test "$failed" -eq 0
            if test "$pending" -eq 0 && test "$codeql_passed" -eq 2; then codeql_ready=true; break; fi
            sleep 10
          done
          test "$codeql_ready" = true
          test "$CATALOG_BASE_COMMIT" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          gh pr merge --squash --delete-branch --match-head-commit "$commit_oid" "$pr_url"
          test "$(gh pr view "$pr_url" --json state --jq .state)" = MERGED
          merge_sha=$(gh pr view "$pr_url" --json mergeCommit --jq '.mergeCommit.oid')
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq '.commit.verification.verified')" = true
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          trap - ERR
      - name: Preserve the decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-auto-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-admission-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the merged Catalog immediately
        if: steps.automate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.pull_request.outputs.merge_sha }}
        run: |
          test "$EXPECTED_MAIN_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          dispatched_at=$(date -u +%s)
          gh workflow run pages.yml --ref main
          pages_run_id=''
          for attempt in $(seq 1 30); do
            runs=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt)
            pages_run_id=$(jq -r --arg sha "$EXPECTED_MAIN_SHA" --argjson dispatched_at "$dispatched_at" '.[] | select(.headSha == $sha and (.createdAt | fromdateiso8601) >= $dispatched_at) | .databaseId' <<<"$runs" | head -n 1)
            test -n "$pages_run_id" && break
            sleep 2
          done
          test -n "$pages_run_id"
          gh run watch "$pages_run_id" --exit-status --interval 10
