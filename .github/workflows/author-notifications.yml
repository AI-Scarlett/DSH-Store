name: Notify upstream plugin authors

on:
  workflow_call:
    inputs:
      catalog_run_id:
        required: true
        type: string
      catalog_run_attempt:
        required: true
        type: string
      catalog_conclusion:
        required: true
        type: string
      inline_catalog_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      catalog_run_id:
        description: Exact completed Catalog run ID to recover
        required: true
        type: string
      catalog_run_attempt:
        description: Exact Catalog run attempt containing the decision artifact
        required: true
        default: "1"
        type: string

run-name: Author notifications for Catalog run ${{ inputs.catalog_run_id }}

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: author-notifications-global-contact
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind the current main authority
        id: base
        run: |
          git fetch --no-tags origin main
          base_sha=$(git rev-parse HEAD)
          test "$base_sha" = "$(git rev-parse origin/main)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve the exact Catalog authority and decision record
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ inputs.catalog_run_id }}
          CATALOG_RUN_ATTEMPT: ${{ inputs.catalog_run_attempt }}
          CATALOG_CONCLUSION: ${{ inputs.catalog_conclusion }}
          INLINE_CATALOG_RUN: ${{ inputs.inline_catalog_run }}
        run: |
          test "$CATALOG_RUN_ID" != null
          test -n "$CATALOG_RUN_ID"
          test "$CATALOG_RUN_ATTEMPT" != null
          test -n "$CATALOG_RUN_ATTEMPT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CATALOG_RUN_ID")
          test "$(jq -r .path <<<"$run")" = '.github/workflows/catalog-automation.yml'
          test "$(jq -r .run_attempt <<<"$run")" = "$CATALOG_RUN_ATTEMPT"
          if test "$INLINE_CATALOG_RUN" = true; then
            test "$CATALOG_RUN_ID" = "$GITHUB_RUN_ID"
            test "$CATALOG_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$CATALOG_CONCLUSION" = success
          else
            test "$(jq -r .status <<<"$run")" = completed
            test "$(jq -r .conclusion <<<"$run")" = success
          fi
          report_dir="$RUNNER_TEMP/catalog-report"
          mkdir -p "$report_dir"
          gh run download "$CATALOG_RUN_ID" \
            --name "catalog-automation-${CATALOG_RUN_ID}-${CATALOG_RUN_ATTEMPT}" \
            --dir "$report_dir"
          report_path=$(find "$report_dir" -type f -name catalog-automation-report.json -print -quit)
          test -n "$report_path"
          echo "path=$report_path" >> "$GITHUB_OUTPUT"
          echo "run_id=$CATALOG_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$CATALOG_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Validate repository and notification code
        run: npm run check
      - name: Snapshot existing managed remediation Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues?state=all&labels=author-action-required&per_page=100" \
            | jq '[.[][] | select(has("pull_request") | not) | {number, title, state, body: (.body // ""), url: .html_url, author: (if .user then {id: .user.id, login: .user.login, node_id: .user.node_id, type: .user.type} else null end), labels: [.labels[] | if type == "string" then . else .name end]}] | sort_by(.number)' \
            > "$RUNNER_TEMP/author-notice-issues.json"
      - name: Select the bounded notification set
        run: |
          jq -n '{}' > "$RUNNER_TEMP/author-notice-targets-empty.json"
          node scripts/plan-author-notices.mjs \
            --catalog registry/catalog.json \
            --candidates registry/candidates.json \
            --report "${{ steps.report.outputs.path }}" \
            --existing-issues "$RUNNER_TEMP/author-notice-issues.json" \
            --notification-targets "$RUNNER_TEMP/author-notice-targets-empty.json" \
            --base-commit "${{ steps.base.outputs.sha }}" \
            --catalog-run-id "${{ steps.report.outputs.run_id }}" \
            --max-create 10 \
            --output "$RUNNER_TEMP/author-notice-preliminary-plan.json"
      - name: Resolve verified human identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/resolve-author-notice-targets.mjs \
            --plan "$RUNNER_TEMP/author-notice-preliminary-plan.json" \
            --output "$RUNNER_TEMP/author-notice-targets.json"
      - name: Collect DSH Store problems from author replies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/collect-author-feedback.mjs \
            --issues "$RUNNER_TEMP/author-notice-issues.json" \
            --notification-targets "$RUNNER_TEMP/author-notice-targets.json" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/author-feedback.json"
      - name: Snapshot the required global contact ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/author-contact-state.mjs --output "$RUNNER_TEMP/author-contact-state.json"
      - name: Create a hash-bound author notification plan
        id: plan
        run: |
          node scripts/plan-author-notices.mjs \
            --catalog registry/catalog.json \
            --candidates registry/candidates.json \
            --report "${{ steps.report.outputs.path }}" \
            --existing-issues "$RUNNER_TEMP/author-notice-issues.json" \
            --contact-state "$RUNNER_TEMP/author-contact-state.json" \
            --notification-targets "$RUNNER_TEMP/author-notice-targets.json" \
            --base-commit "${{ steps.base.outputs.sha }}" \
            --catalog-run-id "${{ steps.report.outputs.run_id }}" \
            --max-create 10 \
            --output "$RUNNER_TEMP/author-notice-plan.json"
          jq -r '"creates=\(.summary.creates)", "updates=\(.summary.updates + .summary.sourceUpdates)", "baselines=\(.summary.baselineUpdates)", "closes=\(.summary.closes)", "queued=\(.summary.queuedNewIssues)", "github_messages=\(.summary.githubMessages)", "email_triggers=\(.summary.githubNotificationEmailTriggers)", "modified_blocked=\(.summary.upstreamModifiedStillBlocked)", "modified_resolved=\(.summary.upstreamModifiedResolved)", "not_modified=\(.summary.noUpstreamModificationDetected)", "source_baselines=\(.summary.sourceTrackingBaselines)", "source_unknown=\(.summary.sourceModificationUnknown)", "candidate_records=\(.summary.candidateRegistryRecords)", "candidate_repositories=\(.summary.candidateRegistryRepositories)", "candidate_accounted=\(.summary.candidateCoverageAccounted)", "candidate_unaccounted=\(.summary.candidateCoverageUnaccounted)", "candidate_direct=\(.summary.candidateDirectNotificationEligible)", "candidate_direct_managed=\(.summary.candidateDirectManagedIssues)", "candidate_direct_scheduled=\(.summary.candidateDirectScheduledThisRun)", "candidate_direct_queued=\(.summary.candidateDirectQueued)", "candidate_public=\(.summary.candidatePublicRegistryOnly)", "candidate_public_remediation=\(.summary.candidatePublicRemediation)", "candidate_public_reviewing=\(.summary.candidatePublicReviewing)", "candidate_public_deferred=\(.summary.candidatePublicDeferred)", "candidate_public_discovery=\(.summary.candidatePublicDiscoveryOnly)", "plan_id=\(.planId)"' \
            "$RUNNER_TEMP/author-notice-plan.json" >> "$GITHUB_OUTPUT"
      - name: Apply only the verified plan with the short-lived repository token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/apply-author-notice-plan.mjs \
            --plan "$RUNNER_TEMP/author-notice-plan.json" \
            --catalog registry/catalog.json \
            --candidates registry/candidates.json \
            --report "${{ steps.report.outputs.path }}" \
            --contact-state "$RUNNER_TEMP/author-contact-state.json" \
            --notification-targets "$RUNNER_TEMP/author-notice-targets.json"
      - name: Publish the bounded run summary
        if: always() && steps.plan.outcome == 'success'
        run: |
          {
            echo "## 作者联系规则核验"
            echo
            jq -r '"- 全局规则：每位 GitHub 用户跨所有项目仅一次初始联系",
              "- 本轮首次联系计划：\(.summary.creates)",
              "- 因联系规则跳过的仓库：\(.summary.contactSuppressedRepositories)",
              "- 自动跟进、重开、修改旧通知和关闭提醒：禁止",
              "- 候选记录覆盖：\(.summary.candidateCoverageAccounted) / \(.summary.candidateRegistryRecords)",
              "- 实际发送以 Apply 步骤为准；邮箱送达未验证"' "$RUNNER_TEMP/author-notice-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the machine-readable notification plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-notification-plan-${{ inputs.catalog_run_id }}-${{ inputs.catalog_run_attempt }}
          path: |
            ${{ runner.temp }}/author-notice-plan.json
            ${{ runner.temp }}/author-feedback.json
          if-no-files-found: warn
          retention-days: 30
