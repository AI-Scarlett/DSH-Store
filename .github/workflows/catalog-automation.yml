name: Automated plugin radar and Catalog update

on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: catalog-automation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the current authority before scanning
        run: npm run validate:registry
      - name: Inspect and apply the bounded automatic policy
        id: automate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          catalog_sha=$(sha256sum registry/catalog.json | cut -d ' ' -f 1)
          candidates_sha=$(sha256sum registry/candidates.json | cut -d ' ' -f 1)
          observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node scripts/automate-catalog.mjs \
            --write \
            --expected-catalog-sha "$catalog_sha" \
            --expected-candidates-sha "$candidates_sha" \
            --catalog-backup "$RUNNER_TEMP/catalog.before.json" \
            --candidates-backup "$RUNNER_TEMP/candidates.before.json" \
            --observed-at "$observed_at" \
            --report "$RUNNER_TEMP/catalog-automation-report.json"
          if git diff --quiet -- registry/catalog.json registry/candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the complete repository after policy changes
        if: steps.automate.outputs.changed == 'true'
        run: npm run check
      - name: Create an auditable automation pull request
        if: steps.automate.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- registry/catalog.json registry/candidates.json
          git commit -m "chore: apply automated Catalog policy"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: automated plugin radar update" \
            --body "Generated by the three-hour fixed-source policy workflow. Third-party install, build, test, and runtime code was not executed. The PR contains only Catalog and candidate registry output and passed npm run check before submission.")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          gh pr merge --auto --squash --delete-branch "$pr_url"
      - name: Preserve the machine plan and decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-automation-report.json
          if-no-files-found: warn
          retention-days: 30
