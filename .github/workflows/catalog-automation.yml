name: Automated plugin radar and Catalog update

on:
  schedule:
    - cron: "5 */8 * * *"
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation identifier
        required: false
        default: manual
        type: string

run-name: Catalog automation (${{ inputs.request_id || github.event_name }})

permissions:
  contents: read

concurrency:
  group: catalog-automation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the fresh main authority for this run
        id: base
        run: |
          git fetch --no-tags origin main
          base_sha=$(git rev-parse HEAD)
          test "$base_sha" = "$(git rev-parse origin/main)"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Validate the current authority before scanning
        run: npm run validate:registry
      - name: Inspect and apply the bounded automatic policy
        id: automate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          catalog_sha=$(sha256sum registry/catalog.json | cut -d ' ' -f 1)
          candidates_sha=$(sha256sum registry/candidates.json | cut -d ' ' -f 1)
          observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node scripts/automate-catalog.mjs \
            --write \
            --expected-catalog-sha "$catalog_sha" \
            --expected-candidates-sha "$candidates_sha" \
            --catalog-backup "$RUNNER_TEMP/catalog.before.json" \
            --catalog-details-backup "$RUNNER_TEMP/catalog-details.before" \
            --candidates-backup "$RUNNER_TEMP/candidates.before.json" \
            --observed-at "$observed_at" \
            --report "$RUNNER_TEMP/catalog-automation-report.json"
          if git diff --quiet -- registry/catalog.json registry/catalog/details registry/candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the complete repository after policy changes
        if: steps.automate.outputs.changed == 'true'
        run: npm run check
      - name: Create an auditable automation pull request
        if: steps.automate.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_BASE_COMMIT: ${{ steps.base.outputs.sha }}
        run: |
          branch="automation/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$CATALOG_BASE_COMMIT" >/dev/null
          cleanup_branch() {
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          }
          trap cleanup_branch ERR
          mutation='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
          # registry/catalog.json @base64 and every catalog/details/*.json @base64 are committed together.
          CATALOG_BRANCH="$branch" python3 - "$RUNNER_TEMP/create-catalog-commit.json" <<'PY'
          import base64, json, os, pathlib, sys

          root = pathlib.Path.cwd()
          additions = []
          for path in [root / "registry/catalog.json", root / "registry/candidates.json", *sorted((root / "registry/catalog/details").glob("*.json"))]:
              additions.append({
                  "path": path.relative_to(root).as_posix(),
                  "contents": base64.b64encode(path.read_bytes()).decode("ascii"),
              })
          mutation = "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }"
          payload = {
              "query": mutation,
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"], "branchName": os.environ["CATALOG_BRANCH"]},
                  "expectedHeadOid": os.environ["CATALOG_BASE_COMMIT"],
                  "message": {"headline": "chore: apply automated Catalog policy"},
                  "fileChanges": {"additions": additions},
              }},
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api graphql --input "$RUNNER_TEMP/create-catalog-commit.json" \
            > "$RUNNER_TEMP/create-catalog-commit-response.json"
          commit_oid=$(jq -er '.data.createCommitOnBranch.commit.oid | select(test("^[0-9a-f]{40}$"))' \
            "$RUNNER_TEMP/create-catalog-commit-response.json")
          gh api "repos/$GITHUB_REPOSITORY/commits/$commit_oid" \
            --jq '.commit.verification.verified' | grep -qx true
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: automated plugin and upstream version update" \
            --body "Generated by the eight-hour fixed-source policy workflow. It discovers new plugins and checks every historical Catalog entry against the canonical repository manifest at a fixed Commit. Third-party install, build, test, and runtime code was not executed. The PR contains only Catalog and candidate registry output and passed npm run check before submission.")
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

          gh workflow run registry.yml --ref "$branch"
          validation_run_id=''
          for attempt in $(seq 1 30); do
            validation_run_id=$(gh run list --workflow registry.yml --branch "$branch" --event workflow_dispatch --limit 1 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$commit_oid\") | .databaseId" | head -n 1)
            test -n "$validation_run_id" && break
            sleep 2
          done
          test -n "$validation_run_id"
          gh run watch "$validation_run_id" --exit-status --interval 10

          codeql_ready=false
          for attempt in $(seq 1 90); do
            checks=$(gh pr checks "$pr_url" --json name,state,bucket || true)
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")
            codeql_passed=$(jq '[.[] | select((.name == "Analyze (actions)" or .name == "Analyze (javascript-typescript)") and .bucket == "pass")] | length' <<<"$checks")
            test "$failed" -eq 0
            if test "$pending" -eq 0 && test "$codeql_passed" -eq 2; then
              codeql_ready=true
              break
            fi
            sleep 10
          done
          test "$codeql_ready" = true
          gh pr merge --squash --delete-branch "$pr_url"
          test "$(gh pr view "$pr_url" --json state --jq .state)" = MERGED
          merge_sha=$(gh pr view "$pr_url" --json mergeCommit --jq '.mergeCommit.oid')
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq '.commit.verification.verified')" = true
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          trap - ERR
      - name: Preserve the machine plan and decision record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-automation-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the merged Catalog immediately
        if: steps.automate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.pull_request.outputs.merge_sha }}
        run: |
          test "$EXPECTED_MAIN_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          dispatched_at=$(date -u +%s)
          gh workflow run pages.yml --ref main
          pages_run_id=''
          for attempt in $(seq 1 30); do
            runs=$(gh run list --workflow pages.yml --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt)
            pages_run_id=$(jq -r \
              --arg sha "$EXPECTED_MAIN_SHA" \
              --argjson dispatched_at "$dispatched_at" \
              '.[] | select(.headSha == $sha and (.createdAt | fromdateiso8601) >= $dispatched_at) | .databaseId' \
              <<<"$runs" | head -n 1)
            test -n "$pages_run_id" && break
            sleep 2
          done
          test -n "$pages_run_id"
          test "$(gh run view "$pages_run_id" --json headSha --jq .headSha)" = "$EXPECTED_MAIN_SHA"
          gh run watch "$pages_run_id" --exit-status --interval 10

  author-notifications:
    needs: update
    if: needs.update.result == 'success'
    uses: ./.github/workflows/author-notifications.yml
    with:
      catalog_run_id: ${{ github.run_id }}
      catalog_run_attempt: ${{ github.run_attempt }}
      catalog_conclusion: ${{ needs.update.result }}
      inline_catalog_run: true
    permissions:
      contents: read
      actions: read
      issues: write

  owner-report:
    needs: [update, author-notifications]
    if: always()
    uses: ./.github/workflows/catalog-run-report.yml
    with:
      catalog_run_id: ${{ github.run_id }}
      catalog_run_attempt: ${{ github.run_attempt }}
      catalog_conclusion: ${{ needs.update.result }}
      inline_catalog_run: true
      request_id: catalog-inline
    permissions:
      contents: read
      actions: read
      issues: write
