name: Plugin submission precheck

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: author-notifications-global-contact
  cancel-in-progress: false

jobs:
  precheck:
    if: contains(github.event.issue.labels.*.name, 'plugin-submission') || startsWith(github.event.issue.title, '[Plugin]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check fixed source and bounded security heuristics without executing third-party code
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-plugin-submission.mjs
          --event "$GITHUB_EVENT_PATH"
          --report "$RUNNER_TEMP/plugin-submission-report.md"
          --result "$RUNNER_TEMP/plugin-submission-result.json"
      - name: Publish static result in Actions
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/plugin-submission-report.md"; then
            cat "$RUNNER_TEMP/plugin-submission-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Send at most one initial result through the global person ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f "$RUNNER_TEMP/plugin-submission-report.md"; then
            node scripts/send-submission-result.mjs \
              --event "$GITHUB_EVENT_PATH" \
              --report "$RUNNER_TEMP/plugin-submission-report.md" \
              --base-commit "$(git rev-parse HEAD)" \
              --plan "$RUNNER_TEMP/submission-contact-plan.json"
          fi
      - name: Preserve report and contact decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-submission-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plugin-submission-report.md
            ${{ runner.temp }}/plugin-submission-result.json
            ${{ runner.temp }}/submission-contact-plan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce precheck result
        if: steps.check.outcome != 'success'
        run: exit 1
