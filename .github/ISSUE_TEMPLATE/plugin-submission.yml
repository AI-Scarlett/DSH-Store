name: 提交 DSH 插件
description: 只需提供公开 GitHub 项目地址，机器人会自动读取必要文件并执行静态预检。
title: "[Plugin] "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交一个项目地址即可

        GitHub Actions 会自动固定默认分支当前 Commit，并读取仓库树、`package.json`、README 和 DSH Bundle Patch，提取包名、版本、许可证、入口 ID、生命周期脚本及声明的兼容范围。

        自动检查不会运行第三方 `install`、`prepare`、`build`、`test` 或运行时代码。提交预检通过后，三小时 Catalog 策略会重新固定源码并执行更严格的许可证、依赖、生命周期、Bundle、完整有界运行时源码和权限信号门禁；只有全部通过才会自动上架。任何未知或高风险信号都会失败关闭，这仍不代表独立安全审计或真实运行验证。

        如果仓库里有多个 DSH 插件，机器人会在评论中列出候选目录；你只需编辑本 Issue 补充下方“插件目录”，无需填写完整 Catalog 元数据。
  - type: input
    id: repository
    attributes:
      label: GitHub repository
      description: 公开的 GitHub 仓库地址；也可以直接粘贴仓库中某个插件目录的 GitHub 链接。
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: plugin-path
    attributes:
      label: Plugin path (optional)
      description: 仅在 monorepo 包含多个 DSH 插件时填写，例如 plugins/example；仓库根目录请留空。
      placeholder: plugins/example
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: 可以补充插件用途、为什么值得上架，或需要审核者留意的风险；不清楚可留空。
    validations:
      required: false
